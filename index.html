<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker: Single File</title>
    <!-- Подключаем React и Babel через CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Анимации для геймификации */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .quest-float { animation: float 3s ease-in-out infinite; }
        
        /* Стили для гистограммы */
        .bar-segment { transition: height 0.5s ease; }
        
        /* Стили для созвездий */
        .star-point { transition: all 0.5s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { Sword, Shield, Play, Square, Edit2, Save, X, Trash2, Upload, User, Moon, Sun } = lucide;

        // --- УТИЛИТЫ ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return { h, m };
        };

        const getStartOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Понедельник
            return new Date(d.setDate(diff)).setHours(0,0,0,0);
        };

        // --- КОМПОНЕНТЫ ---

        // 1. Иконки тем
        const ThemeIcon = ({ type, status, isQuest }) => {
            if (!isQuest) {
                // Серьезная тема: простые геометрические фигуры
                return (
                    <div className={`w-6 h-6 border-2 flex items-center justify-center rounded-sm
                        ${status === 'done' ? 'bg-green-100 border-green-500' : 'border-gray-400'}`}>
                        {status === 'done' && <div className="w-3 h-3 bg-green-500 rounded-full"></div>}
                    </div>
                );
            }
            // Квест тема
            if (status === 'done') {
                return <Shield className="w-6 h-6 text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]" />;
            }
            return <Sword className="w-6 h-6 text-red-400 drop-shadow-[0_0_8px_rgba(248,113,113,0.5)]" />;
        };

        // 2. Компонент Задачи (Машина состояний)
        const TaskItem = ({ task, onUpdate, onDelete, isQuest }) => {
            const [editH, setEditH] = useState(0);
            const [editM, setEditM] = useState(0);
            const timerRef = useRef(null);

            // Логика таймера
            useEffect(() => {
                if (task.status === 'running') {
                    timerRef.current = setInterval(() => {
                        onUpdate(task.id, { 
                            tempSeconds: Math.floor((Date.now() - task.startTime) / 1000) 
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [task.status, task.startTime]);

            const handleStart = () => {
                onUpdate(task.id, { status: 'running', startTime: Date.now(), tempSeconds: 0 });
            };

            const handleStop = () => {
                const finalSeconds = Math.floor((Date.now() - task.startTime) / 1000);
                onUpdate(task.id, { status: 'done', durationSeconds: finalSeconds, startTime: null, tempSeconds: null });
            };

            const handleEditClick = () => {
                const { h, m } = formatTime(task.durationSeconds);
                setEditH(h);
                setEditM(m);
                onUpdate(task.id, { status: 'editing' });
            };

            const handleSaveEdit = () => {
                const totalSec = (parseInt(editH) || 0) * 3600 + (parseInt(editM) || 0) * 60;
                onUpdate(task.id, { status: 'done', durationSeconds: totalSec, tempSeconds: null });
            };

            const handleCancelEdit = () => {
                onUpdate(task.id, { status: 'done' }); // Возврат к просмотренному состоянию
            };

            // Отображение времени
            const displayTime = () => {
                if (task.status === 'idle') return "00:00";
                if (task.status === 'running' || task.status === 'editing') {
                    const sec = task.status === 'editing' ? (editH * 3600 + editM * 60) : (task.tempSeconds || 0);
                    const { h, m } = formatTime(sec);
                    return `${h}ч ${m}м`;
                }
                if (task.status === 'done') {
                    const { h, m } = formatTime(task.durationSeconds);
                    return `Сделано за ${h}ч ${m}м`;
                }
            };

            // Стили в зависимости от темы
            const containerClass = isQuest 
                ? "bg-slate-800 border-slate-700 text-slate-100 shadow-lg mb-3 p-4 rounded-xl border-l-4 border-l-red-500 quest-float"
                : "bg-white border border-gray-200 text-gray-800 shadow-sm mb-2 p-3 rounded flex items-center justify-between";

            return (
                <div className={containerClass}>
                    <div className="flex items-center gap-3 flex-1">
                        <ThemeIcon type={task.type} status={task.status} isQuest={isQuest} />
                        
                        {task.status === 'editing' ? (
                            <div className="flex items-center gap-2">
                                <input type="number" value={editH} onChange={e => setEditH(e.target.value)} 
                                    className="w-16 p-1 border rounded text-center bg-transparent" placeholder="Ч" />
                                <span>:</span>
                                <input type="number" value={editM} onChange={e => setEditM(e.target.value)} 
                                    className="w-16 p-1 border rounded text-center bg-transparent" placeholder="М" />
                            </div>
                        ) : (
                            <span className={`font-medium ${task.status === 'done' ? 'line-through opacity-70' : ''}`}>
                                {task.title}
                            </span>
                        )}
                    </div>

                    <div className="flex items-center gap-2">
                        <span className="font-mono text-sm w-24 text-right">
                            {displayTime()}
                        </span>

                        {task.status === 'idle' && (
                            <button onClick={handleStart} className={`p-2 rounded ${isQuest ? 'bg-red-900 hover:bg-red-800' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
                                <Play size={16} />
                            </button>
                        )}
                        {task.status === 'running' && (
                            <button onClick={handleStop} className={`p-2 rounded ${isQuest ? 'bg-yellow-900 hover:bg-yellow-800' : 'bg-red-500 text-white hover:bg-red-600'}`}>
                                <Square size={16} />
                            </button>
                        )}
                        {task.status === 'done' && (
                            <>
                                <button onClick={handleEditClick} className="p-2 text-gray-500 hover:text-blue-500">
                                    <Edit2 size={16} />
                                </button>
                                <button onClick={() => onDelete(task.id)} className="p-2 text-gray-500 hover:text-red-500">
                                    <Trash2 size={16} />
                                </button>
                            </>
                        )}
                        {task.status === 'editing' && (
                            <>
                                <button onClick={handleSaveEdit} className="p-2 text-green-500 hover:text-green-700">
                                    <Save size={16} />
                                </button>
                                <button onClick={handleCancelEdit} className="p-2 text-red-500 hover:text-red-700">
                                    <X size={16} />
                                </button>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // 3. Статистика
        const StatsBlock = ({ tasks, isQuest }) => {
            const stats = useMemo(() => {
                const now = new Date();
                const startOfWeek = getStartOfWeek(now);
                const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                
                // Инициализация данных по дням
                const data = days.map(() => ({ tech: 0, soft: 0 }));

                tasks.filter(t => t.status === 'done').forEach(t => {
                    // Используем дату создания как приблизительную дату выполнения для простоты
                    // В реальном проекте нужно хранить completedAt
                    const tDate = new Date(t.createdAt);
                    if (tDate.getTime() >= startOfWeek) {
                        const dayIndex = tDate.getDay() === 0 ? 6 : tDate.getDay() - 1;
                        const mins = t.durationSeconds / 60;
                        if (t.type === 'technical') data[dayIndex].tech += mins;
                        else data[dayIndex].soft += mins;
                    }
                });
                return { data, days };
            }, [tasks]);

            const maxVal = Math.max(...stats.data.map(d => d.tech + d.soft), 60); // Минимум шкала 60 мин

            if (isQuest) {
                // Режим Созвездия
                return (
                    <div className="bg-slate-900 rounded-xl p-6 border border-slate-700 mt-8 relative overflow-hidden min-h-[200px]">
                        <h3 className="text-slate-400 text-sm uppercase tracking-widest mb-4">Карта Созвездий (Неделя)</h3>
                        <div className="relative h-40 w-full flex justify-between items-end px-2">
                            {/* Линии соединения (упрощенно) */}
                            <svg className="absolute top-0 left-0 w-full h-full pointer-events-none">
                                <polyline 
                                    points={stats.data.map((d, i) => {
                                        const x = (i / 6) * 100 + "%";
                                        const y = 100 - ((d.tech + d.soft) / maxVal) * 100;
                                        return `${x},${y}`;
                                    }).join(" ")}
                                    fill="none" stroke="#475569" strokeWidth="2" strokeDasharray="4 4"
                                />
                            </svg>
                            
                            {stats.data.map((d, i) => {
                                const total = d.tech + d.soft;
                                const stars = Math.ceil(total / 60); // 1 звезда за 60 мин
                                return (
                                    <div key={i} className="flex flex-col items-center gap-1 z-10">
                                        <div className="flex flex-col-reverse gap-1 h-24 justify-end">
                                            {[...Array(stars)].map((_, sIdx) => (
                                                <div key={sIdx} className={`w-2 h-2 rounded-full ${d.tech > d.soft ? 'bg-cyan-400 shadow-[0_0_5px_cyan]' : 'bg-purple-400 shadow-[0_0_5px_magenta]'}`}></div>
                                            ))}
                                        </div>
                                        <span className="text-xs text-slate-500">{stats.days[i]}</span>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            }

            // Режим Гистограммы
            return (
                <div className="bg-white rounded-xl p-6 border border-gray-200 mt-8 shadow-sm">
                    <h3 className="text-gray-500 text-sm font-bold uppercase tracking-widest mb-4">Статистика за неделю (мин)</h3>
                    <div className="flex justify-between items-end h-40 gap-2">
                        {stats.data.map((d, i) => {
                            const total = d.tech + d.soft;
                            const heightPercent = (total / maxVal) * 100;
                            const techPercent = total > 0 ? (d.tech / total) * 100 : 0;
                            
                            return (
                                <div key={i} className="flex-1 flex flex-col items-center gap-2 group">
                                    <div className="w-full bg-gray-100 rounded-t-md relative overflow-hidden h-full flex flex-col-reverse">
                                        <div style={{ height: `${heightPercent}%` }} className="w-full flex flex-col-reverse transition-all duration-500">
                                            <div style={{ height: `${techPercent}%` }} className="w-full bg-blue-500 opacity-80"></div>
                                            <div style={{ height: `${100 - techPercent}%` }} className="w-full bg-green-500 opacity-80"></div>
                                        </div>
                                    </div>
                                    <span className="text-xs text-gray-400 font-medium">{stats.days[i]}</span>
                                </div>
                            )
                        })}
                    </div>
                    <div className="flex justify-center gap-4 mt-4 text-xs text-gray-500">
                        <div className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-500 rounded-sm"></div> Техника</div>
                        <div className="flex items-center gap-1"><div className="w-3 h-3 bg-green-500 rounded-sm"></div> Soft Skills</div>
                    </div>
                </div>
            );
        };

        // 4. Главное приложение
        const App = () => {
            // Состояния
            const [isQuest, setIsQuest] = useState(false);
            const [user, setUser] = useState({ name: 'Гость', avatar: null });
            const [tasks, setTasks] = useState([]);
            const [newTaskTech, setNewTaskTech] = useState('');
            const [newTaskSoft, setNewTaskSoft] = useState('');

            // Загрузка из LocalStorage
            useEffect(() => {
                const savedUser = localStorage.getItem('app_user');
                const savedTasks = localStorage.getItem('app_tasks');
                const savedTheme = localStorage.getItem('app_theme');
                
                if (savedUser) setUser(JSON.parse(savedUser));
                if (savedTasks) setTasks(JSON.parse(savedTasks));
                if (savedTheme) setIsQuest(JSON.parse(savedTheme));
            }, []);

            // Сохранение в LocalStorage
            useEffect(() => {
                localStorage.setItem('app_user', JSON.stringify(user));
                localStorage.setItem('app_tasks', JSON.stringify(tasks));
                localStorage.setItem('app_theme', JSON.stringify(isQuest));
            }, [user, tasks, isQuest]);

            // Обработчики
            const handleAvatarUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUser({ ...user, avatar: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const addTask = (type) => {
                const title = type === 'technical' ? newTaskTech : newTaskSoft;
                if (!title.trim()) return;
                
                const newTask = {
                    id: generateId(),
                    type,
                    title,
                    status: 'idle',
                    durationSeconds: 0,
                    createdAt: Date.now()
                };
                
                setTasks([newTask, ...tasks]);
                if (type === 'technical') setNewTaskTech('');
                else setNewTaskSoft('');
            };

            const updateTask = (id, updates) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, ...updates } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            // Рендер
            return (
                <div className={`min-h-screen transition-colors duration-500 ${isQuest ? 'bg-slate-950 text-slate-200' : 'bg-gray-50 text-gray-900'}`}>
                    
                    {/* Header */}
                    <header className={`sticky top-0 z-50 backdrop-blur-md border-b px-4 py-3 flex justify-between items-center
                        ${isQuest ? 'bg-slate-900/80 border-slate-800' : 'bg-white/80 border-gray-200'}`}>
                        
                        <div className="flex items-center gap-3">
                            <div className="relative group">
                                <div className="w-10 h-10 rounded-full overflow-hidden border-2 border-gray-300 bg-gray-200 flex items-center justify-center">
                                    {user.avatar ? (
                                        <img src={user.avatar} alt="Avatar" className="w-full h-full object-cover" />
                                    ) : (
                                        <User className="text-gray-400" />
                                    )}
                                </div>
                                <label className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 cursor-pointer flex items-center justify-center rounded-full transition-opacity">
                                    <Upload size={16} className="text-white" />
                                    <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                                </label>
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight">{user.name}</h1>
                                <p className="text-xs opacity-60">Продуктивность</p>
                            </div>
                        </div>

                        <button 
                            onClick={() => setIsQuest(!isQuest)}
                            className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold transition-all
                                ${isQuest 
                                    ? 'bg-indigo-600 text-white shadow-[0_0_15px_rgba(79,70,229,0.5)]' 
                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                        >
                            {isQuest ? <Moon size={16} /> : <Sun size={16} />}
                            {isQuest ? 'Квест режим' : 'Рабочий режим'}
                        </button>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-4xl mx-auto p-4 pb-20">
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            {/* Левая колонка: Технические */}
                            <div>
                                <h2 className={`text-xl font-bold mb-4 flex items-center gap-2 ${isQuest ? 'text-cyan-400' : 'text-gray-800'}`}>
                                    <Sword size={20} /> Технические задачи
                                </h2>
                                <div className="space-y-2">
                                    {tasks.filter(t => t.type === 'technical').map(task => (
                                        <TaskItem key={task.id} task={task} onUpdate={updateTask} onDelete={deleteTask} isQuest={isQuest} />
                                    ))}
                                </div>
                                <div className={`mt-4 flex gap-2 p-2 rounded-lg ${isQuest ? 'bg-slate-900' : 'bg-white border'}`}>
                                    <input 
                                        value={newTaskTech}
                                        onChange={(e) => setNewTaskTech(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && addTask('technical')}
                                        placeholder="Новая задача..." 
                                        className={`flex-1 bg-transparent outline-none px-2 ${isQuest ? 'placeholder-slate-600' : ''}`}
                                    />
                                    <button onClick={() => addTask('technical')} className={`px-3 py-1 rounded font-bold ${isQuest ? 'bg-cyan-900 text-cyan-200' : 'bg-gray-800 text-white'}`}>+</button>
                                </div>
                            </div>

                            {/* Правая колонка: Мягкие навыки */}
                            <div>
                                <h2 className={`text-xl font-bold mb-4 flex items-center gap-2 ${isQuest ? 'text-purple-400' : 'text-gray-800'}`}>
                                    <Shield size={20} /> Soft Skills
                                </h2>
                                <div className="space-y-2">
                                    {tasks.filter(t => t.type === 'soft').map(task => (
                                        <TaskItem key={task.id} task={task} onUpdate={updateTask} onDelete={deleteTask} isQuest={isQuest} />
                                    ))}
                                </div>
                                <div className={`mt-4 flex gap-2 p-2 rounded-lg ${isQuest ? 'bg-slate-900' : 'bg-white border'}`}>
                                    <input 
                                        value={newTaskSoft}
                                        onChange={(e) => setNewTaskSoft(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && addTask('soft')}
                                        placeholder="Новая задача..." 
                                        className={`flex-1 bg-transparent outline-none px-2 ${isQuest ? 'placeholder-slate-600' : ''}`}
                                    />
                                    <button onClick={() => addTask('soft')} className={`px-3 py-1 rounded font-bold ${isQuest ? 'bg-purple-900 text-purple-200' : 'bg-gray-800 text-white'}`}>+</button>
                                </div>
                            </div>
                        </div>

                        {/* Статистика */}
                        <StatsBlock tasks={tasks} isQuest={isQuest} />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
