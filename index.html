<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Tracker</title>
<style>
:root{--bg:#fff;--text:#222;--border:#ccc;--tech:#3498db;--soft:#2ecc71}
body.dark{--bg:#0a1628;--text:#eef;--border:#446;--tech:#5af;--soft:#5f5}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--text);transition:.3s}
.header{display:flex;align-items:center;justify-content:space-between;padding:15px;border-bottom:1px solid var(--border)}
.avatar{width:60px;height:60px;border-radius:50%;background:#ddd;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.theme-btn{padding:8px 15px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.container{display:flex;gap:20px;padding:20px;max-width:1200px;margin:0 auto}
.col{flex:1;background:rgba(0,0,0,0.03);padding:15px;border-radius:8px;border:1px solid var(--border)}
h2{margin-top:0;font-size:1.2rem;border-bottom:1px solid var(--border);padding-bottom:10px}
.task-list{list-style:none;padding:0;margin:0}
.task-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
.task-icon{margin-right:10px;font-size:1.2rem;width:20px;text-align:center}
.timer-btn{background:none;border:1px solid var(--border);padding:5px 10px;cursor:pointer;color:var(--text);font-family:monospace;font-size:1rem;border-radius:4px}
.timer-btn.running{background:var(--tech);color:#fff;border-color:var(--tech)}
.edit-btn{margin-left:10px;background:none;border:none;cursor:pointer;font-size:1rem;opacity:0.6}
.input-row{display:flex;gap:10px;margin-top:15px}
.input-row input{flex:1;padding:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:4px}
.input-row button{padding:8px 15px;background:var(--text);color:var(--bg);border:none;cursor:pointer;border-radius:4px}
.stats{padding:20px;max-width:1200px;margin:0 auto}
.stat-title{text-align:center;margin-bottom:15px}
/* Serious Chart */
.histogram{display:flex;justify-content:space-around;align-items:flex-end;height:150px;padding:10px;border:1px solid var(--border)}
.bar-col{display:flex;flex-direction:column;align-items:center;width:12%}
.bar{width:100%;display:flex;flex-direction:column-reverse}
.seg-tech{background:var(--tech);transition:height .5s}
.seg-soft{background:var(--soft);transition:height .5s}
.day-label{font-size:0.8rem;margin-top:5px}
/* Quest Chart */
.constellation{position:relative;height:200px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.star{position:absolute;width:8px;height:8px;background:#ffeb3b;border-radius:50%;box-shadow:0 0 5px #ffeb3b;z-index:2}
.star.soft{background:#5f5;box-shadow:0 0 5px #5f5}
svg.lines{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.line-seg{stroke:rgba(255,255,255,0.3);stroke-width:1}
.edit-inputs{display:flex;gap:5px;align-items:center}
.edit-inputs input{width:40px;padding:2px}
.save-edit{padding:2px 5px;font-size:0.8rem}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:15px">
    <div class="avatar" id="avatarBox">
      <svg viewBox="0 0 24 24" fill="#999"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
    <h1 style="margin:0;font-size:1.5rem">Трекер Задач</h1>
  </div>
  <button class="theme-btn" id="themeToggle">Сменить тему</button>
</div>

<div class="container">
  <div class="col" id="colTech">
    <h2>Технические задачи ⚙️</h2>
    <ul class="task-list" id="listTech"></ul>
    <div class="input-row">
      <input type="text" id="inTech" placeholder="Новая задача...">
      <button onclick="addTask('tech')">Добавить</button>
    </div>
  </div>
  <div class="col" id="colSoft">
    <h2>Мягкие навыки 🧠</h2>
    <ul class="task-list" id="listSoft"></ul>
    <div class="input-row">
      <input type="text" id="inSoft" placeholder="Новый навык...">
      <button onclick="addTask('soft')">Добавить</button>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat-title">Статистика за неделю</div>
  <div id="chartContainer"></div>
</div>

<script>
const LS_KEY='tasks_v1';
const LS_AVATAR='avatar_v1';
const LS_THEME='theme_v1';
let tasks=[];
let theme='serious';
let timers={};

try{
  tasks=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  theme=localStorage.getItem(LS_THEME)||'serious';
}catch(e){console.error('LS error',e);}

// Init
document.body.className=theme==='quest'?'dark':'';
loadAvatar();
render();
renderStats();

// Avatar
document.getElementById('avatarBox').onclick=()=>document.getElementById('avatarInput').click();
document.getElementById('avatarInput').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{localStorage.setItem(LS_AVATAR,ev.target.result);loadAvatar();}
    catch(err){alert('Фото слишком большое');}
  };
  r.readAsDataURL(f);
};
function loadAvatar(){
  const src=localStorage.getItem(LS_AVATAR);
  const box=document.getElementById('avatarBox');
  if(src){box.innerHTML='<img src="'+src+'">'}
  else{box.innerHTML='<svg viewBox="0 0 24 24" fill="#999"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>'}
}

// Theme Toggle
document.getElementById('themeToggle').onclick=()=>{
  theme=theme==='serious'?'quest':'serious';
  localStorage.setItem(LS_THEME,theme);
  document.body.className=theme==='quest'?'dark':'';
  render();
  renderStats();
};

// Logic
function save(){localStorage.setItem(LS_KEY,JSON.stringify(tasks));renderStats();}
function addTask(type){
  const inp=document.getElementById(type==='tech'?'inTech':'inSoft');
  const txt=inp.value.trim();
  if(!txt)return;
  tasks.push({id:Date.now(),type,text:'',done:false,timeSpent:0,lastStart:null});
  inp.value='';
  save();
}
function toggleTimer(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  if(timers[id]){
    clearInterval(timers[id]);
    delete timers[id];
    t.done=true;
    t.lastStart=null;
  }else{
    t.lastStart=Date.now();
    timers[id]=setInterval(()=>{
      t.timeSpent++;
      save();
    },60000);
  }
  save();
}
function editTime(id){
  const t=tasks.find(x=>x.id===id);
  const row=document.getElementById('row-'+id);
  const h=Math.floor(t.timeSpent/60);
  const m=t.timeSpent%60;
  row.innerHTML=`<span class="task-icon">${getIcon(t)}</span><span style="flex:1">${t.text}</span>
    <div class="edit-inputs">
      <input type="number" id="ed-h-${id}" value="${h}" min="0">ч
      <input type="number" id="ed-m-${id}" value="${m}" min="0" max="59">м
      <button class="save-edit" onclick="saveEdit(${id})">OK</button>
    </div>`;
}
function saveEdit(id){
  const t=tasks.find(x=>x.id===id);
  const h=parseInt(document.getElementById('ed-h-'+id).value)||0;
  const m=parseInt(document.getElementById('ed-m-'+id).value)||0;
  t.timeSpent=h*60+m;
  save();
}
function getIcon(t){
  if(theme==='quest') return t.done?'🛡️':'⚔️';
  return t.done?'🔘':'⚪';
}
function fmt(mins){
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `${h}ч ${m.toString().padStart(2,'0')}м`;
}
function render(){
  ['tech','soft'].forEach(type=>{
    const list=document.getElementById(type==='tech'?'listTech':'listSoft');
    list.innerHTML='';
    tasks.filter(t=>t.type===type).forEach(t=>{
      const li=document.createElement('li');
      li.className='task-item';
      li.id='row-'+t.id;
      let btnTxt='00:00';
      let btnClass='timer-btn';
      if(timers[t.id]){
        btnTxt='▶ '+fmt(t.timeSpent+Math.floor((Date.now()-t.lastStart)/60000));
        btnClass+=' running';
      }else if(t.done){
        btnTxt='Сделано за '+fmt(t.timeSpent);
      }
      li.innerHTML=`<span class="task-icon">${getIcon(t)}</span><span style="flex:1">${t.text}</span>
        <button class="${btnClass}" onclick="toggleTimer(${t.id})">${btnTxt}</button>
        ${t.done?'<button class="edit-btn" onclick="editTime('+t.id+')">✎</button>':''}`;
      list.appendChild(li);
    });
  });
  // Update running timers text live
  Object.keys(timers).forEach(id=>{
    const t=tasks.find(x=>x.id==id);
    const btn=document.querySelector(`button[onclick="toggleTimer(${id})"]`);
    if(btn && t){
      const cur=t.timeSpent+Math.floor((Date.now()-t.lastStart)/60000);
      btn.textContent='▶ '+fmt(cur);
    }
  });
}
setInterval(render,1000);

// Stats
function getWeekDays(){
  const now=new Date();
  const day=now.getDay()||7;
  const mon=new Date(now);
  mon.setDate(now.getDate()-day+1);
  mon.setHours(0,0,0,0);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    days.push(d.getTime());
  }
  return days;
}
function renderStats(){
  const container=document.getElementById('chartContainer');
  const weekStarts=getWeekDays();
  const data={tech:[0,0,0,0,0,0,0],soft:[0,0,0,0,0,0,0]};
  
  tasks.forEach(t=>{
    // Simple logic: assign all time to today if not dated, 
    // but requirement says "Mon-Sun current week". 
    // Since we don't store dates per task in this compact version, 
    // we will simulate distribution or just dump to today for demo.
    // To make it functional: We assume tasks created this week count.
    const created=new Date(t.id);
    const ts=created.getTime();
    if(ts>=weekStarts[0] && ts<=weekStarts[6]+86400000){
       // Find day index
       let idx=0;
       for(let i=0;i<7;i++){
         if(ts>=weekStarts[i] && ts<weekStarts[i]+86400000) idx=i;
       }
       if(t.type==='tech') data.tech[idx]+=t.timeSpent;
       else data.soft[idx]+=t.timeSpent;
    }
  });

  if(theme==='serious'){
    let html='<div class="histogram">';
    const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    for(let i=0;i<7;i++){
      const total=data.tech[i]+data.soft[i];
      const hTotal=Math.min(total,120); // cap at 2h for visual
      const pctT=total? (data.tech[i]/total)*100 : 0;
      const pctS=total? (data.soft[i]/total)*100 : 0;
      const hPx=(hTotal/120)*100;
      html+=`<div class="bar-col"><div class="bar" style="height:${hPx}%"><div class="seg-tech" style="height:${pctT}%"></div><div class="seg-soft" style="height:${pctS}%"></div></div><div class="day-label">${days[i]}</div></div>`;
    }
    html+='</div>';
    container.innerHTML=html;
  }else{
    // Quest Constellation
    let html='<div class="constellation"><svg class="lines"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fff" /></marker></defs>';
    // Points
    const points=[];
    let x=20, y=20;
    for(let i=0;i<7;i++){
      const mins=data.tech[i]+data.soft[i];
      const stars=Math.floor(mins/60);
      for(let s=0;s<stars;s++){
        points.push({x:x+(Math.random()*40), y:y+(Math.random()*80), type: s<data.tech[i]?'tech':'soft'});
      }
      x+=130;
    }
    // Draw lines
    if(points.length>1){
      let d=`M${points[0].x} ${points[0].y}`;
      points.forEach(p=>d+=` L${p.x} ${p.y}`);
      html+=`<path d="${d}" class="line-seg" fill="none" />`;
    }
    // Draw stars
    points.forEach(p=>{
      html+=`<div class="star ${p.type}" style="left:${p.x}px;top:${p.y}px"></div>`;
    });
    html+='</svg></div>';
    container.innerHTML=html;
  }
}
</script>
</body>
</html>
