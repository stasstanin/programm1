<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<style>
:root { --bg: #fff; --text: #333; --border: #ccc; --input-bg: #fff; --tech-color: #2196F3; --soft-color: #4CAF50; }
body.quest { --bg: #0a192f; --text: #e6f1ff; --border: #1d4ed8; --input-bg: #112240; }
body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.avatar-container { position: relative; width: 80px; height: 80px; cursor: pointer; overflow: hidden; border-radius: 50%; border: 2px solid var(--border); background: #eee; }
.avatar-img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-svg { width: 100%; height: 100%; fill: #999; }
.theme-btn { padding: 8px 16px; cursor: pointer; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); }
.container { display: flex; gap: 20px; }
.column { flex: 1; background: var(--input-bg); border: 1px solid var(--border); padding: 15px; border-radius: 4px; }
.column h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.task-list { list-style: none; padding: 0; min-height: 200px; }
.task-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.2); }
.task-icon { margin-right: 10px; font-size: 18px; width: 20px; text-align: center; }
.task-text { flex-grow: 1; }
.timer-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 4px 8px; cursor: pointer; font-family: inherit; min-width: 80px; }
.edit-btn { background: none; border: none; cursor: pointer; font-size: 14px; margin-left: 5px; opacity: 0.7; }
.edit-panel { display: flex; gap: 5px; align-items: center; }
.edit-input { width: 50px; padding: 2px; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
.save-edit-btn { padding: 2px 6px; cursor: pointer; background: var(--tech-color); color: white; border: none; }
.add-form { display: flex; gap: 10px; margin-top: 15px; }
.add-input { flex-grow: 1; padding: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
.add-btn { padding: 8px 16px; background: var(--tech-color); color: white; border: none; cursor: pointer; }
.stats-container { margin-top: 30px; padding: 20px; background: var(--input-bg); border: 1px solid var(--border); }
.histogram { display: flex; justify-content: space-around; align-items: flex-end; height: 150px; padding-top: 20px; }
.bar-group { display: flex; flex-direction: column; align-items: center; width: 12%; height: 100%; justify-content: flex-end; }
.bar-segment { width: 100%; transition: height 0.3s; }
.bar-tech { background: var(--tech-color); }
.bar-soft { background: var(--soft-color); }
.day-label { margin-top: 5px; font-size: 12px; }
.constellation { position: relative; height: 200px; background: #020c1b; border: 1px solid #1d4ed8; overflow: hidden; }
.star-point { position: absolute; width: 6px; height: 6px; background: gold; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 5px gold; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar-container" id="avatarContainer">
    <svg class="avatar-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <img class="avatar-img" id="avatarImg" alt="Avatar">
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
  </div>
  <button class="theme-btn" id="themeToggle">Тема: Серьезная</button>
</div>

<div class="container">
  <div class="column" id="col-tech">
    <h2>Технические задачи ⚙️</h2>
    <ul class="task-list" id="list-tech"></ul>
    <div class="add-form">
      <input type="text" class="add-input" id="input-tech" placeholder="Новая задача...">
      <button class="add-btn" onclick="addTask('tech')">Добавить</button>
    </div>
  </div>
  <div class="column" id="col-soft">
    <h2>Мягкие навыки 🤝</h2>
    <ul class="task-list" id="list-soft"></ul>
    <div class="add-form">
      <input type="text" class="add-input" id="input-soft" placeholder="Новый навык...">
      <button class="add-btn" onclick="addTask('soft')">Добавить</button>
    </div>
  </div>
</div>

<div class="stats-container" id="statsBox">
  <h3>Статистика за неделю</h3>
  <div id="statsContent"></div>
</div>

<script>
let tasks = [];
let theme = 'serious';
let timers = {};

function init() {
  try {
    const savedTasks = localStorage.getItem('tt_tasks');
    tasks = savedTasks ? JSON.parse(savedTasks) : [];
    const savedTheme = localStorage.getItem('tt_theme');
    if (savedTheme === 'quest') setTheme('quest');
    const savedAvatar = localStorage.getItem('tt_avatar');
    if (savedAvatar) {
      document.getElementById('avatarImg').src = savedAvatar;
      document.getElementById('avatarImg').style.display = 'block';
      document.querySelector('.avatar-svg').style.display = 'none';
    }
    tasks.forEach(t => { if(t.status==='completed' && !t.completedAt) t.completedAt = Date.now(); });
  } catch (e) { console.error(e); tasks = []; }
  render();
  renderStats();
}

function saveData() {
  localStorage.setItem('tt_tasks', JSON.stringify(tasks));
  localStorage.setItem('tt_theme', theme);
}

document.getElementById('avatarContainer').addEventListener('click', () => document.getElementById('avatarInput').click());
document.getElementById('avatarInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    localStorage.setItem('tt_avatar', evt.target.result);
    document.getElementById('avatarImg').src = evt.target.result;
    document.getElementById('avatarImg').style.display = 'block';
    document.querySelector('.avatar-svg').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('themeToggle').addEventListener('click', () => setTheme(theme === 'serious' ? 'quest' : 'serious'));

function setTheme(newTheme) {
  theme = newTheme;
  document.body.className = theme === 'quest' ? 'quest' : '';
  document.getElementById('themeToggle').innerText = theme === 'quest' ? 'Тема: Квест' : 'Тема: Серьезная';
  saveData();
  render();
  renderStats();
}

function addTask(type) {
  const input = document.getElementById(`input-${type}`);
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: Date.now(), type, text, status: 'pending', elapsedTime: 0, completedAt: null });
  input.value = '';
  saveData();
  render();
  renderStats();
}

function toggleTimer(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.status === 'completed') return;

  if (!timers[id]) {
    timers[id] = { startTime: Date.now(), elapsed: 0, intervalId: setInterval(() => updateTimerDisplay(id), 1000) };
  } else {
    clearInterval(timers[id].intervalId);
    const diffMins = Math.floor((Date.now() - timers[id].startTime) / 60000);
    task.elapsedTime = timers[id].elapsed + diffMins;
    task.status = 'completed';
    task.completedAt = Date.now();
    delete timers[id];
    saveData();
    render();
    renderStats();
  }
}

function updateTimerDisplay(id) {
  if (!timers[id]) return;
  const totalMins = timers[id].elapsed + Math.floor((Date.now() - timers[id].startTime) / 60000);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  const btn = document.getElementById(`timer-btn-${id}`);
  if (btn) btn.innerText = `${h}ч ${m.toString().padStart(2, '0')}м`;
}

function editTask(id, event) {
  if(event) event.stopPropagation();
  const task = tasks.find(t => t.id === id);
  if (!task || task.status !== 'completed') return;
  const row = document.getElementById(`task-row-${id}`);
  const textSpan = row.querySelector('.task-text');
  const hours = Math.floor(task.elapsedTime / 60);
  const mins = task.elapsedTime % 60;
  textSpan.innerHTML = `
    <div class="edit-panel">
      <input type="number" class="edit-input" id="edit-h-${id}" value="${hours}" min="0">
      <span>:</span>
      <input type="number" class="edit-input" id="edit-m-${id}" value="${mins}" min="0" max="59">
      <button class="save-edit-btn" onclick="saveEdit(${id})">OK</button>
    </div>`;
  row.querySelector('.timer-btn').style.display = 'none';
  row.querySelector('.edit-btn').style.display = 'none';
}

function saveEdit(id) {
  const h = parseInt(document.getElementById(`edit-h-${id}`).value) || 0;
  const m = parseInt(document.getElementById(`edit-m-${id}`).value) || 0;
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.elapsedTime = (h * 60) + m;
    saveData();
    render();
    renderStats();
  }
}

function deleteTask(id) {
  if(!confirm('Удалить?')) return;
  if (timers[id]) { clearInterval(timers[id].intervalId); delete timers[id]; }
  tasks = tasks.filter(t => t.id !== id);
  saveData();
  render();
  renderStats();
}

function render() {
  const techList = document.getElementById('list-tech');
  const softList = document.getElementById('list-soft');
  techList.innerHTML = '';
  softList.innerHTML = '';

  tasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item';
    li.id = `task-row-${task.id}`;
    
    let icon = theme === 'quest' ? (task.status === 'completed' ? '🛡️' : '⚔️') : (task.status === 'completed' ? '🔘' : '⚪');
    let timerText = '00:00';
    
    if (task.status === 'completed') {
      const h = Math.floor(task.elapsedTime / 60);
      const m = task.elapsedTime % 60;
      timerText = `Сделано за ${h}ч ${m}м`;
    } else if (timers[task.id]) {
      const t = timers[task.id];
      const totalMins = t.elapsed + Math.floor((Date.now() - t.startTime)/60000);
      timerText = `${Math.floor(totalMins/60)}ч ${(totalMins%60).toString().padStart(2,'0')}м`;
    }

    const editBtn = task.status === 'completed' ? `<button class="edit-btn" onclick="editTask(${task.id}, event)">✏️</button>` : '';
    
    li.innerHTML = `
      <span class="task-icon">${icon}</span>
      <span class="task-text">${task.text}</span>
      <div style="display:flex; align-items:center;">
        <button id="timer-btn-${task.id}" class="timer-btn" onclick="toggleTimer(${task.id})">${timerText}</button>
        ${editBtn}
        <button class="edit-btn" style="color:red" onclick="deleteTask(${task.id})">🗑️</button>
      </div>`;

    if (task.type === 'tech') techList.appendChild(li);
    else softList.appendChild(li);
  });
}

function renderStats() {
  const container = document.getElementById('statsContent');
  container.innerHTML = '';
  const now = new Date();
  const dayOfWeek = now.getDay() || 7; 
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek + 1);
  monday.setHours(0,0,0,0);
  
  const weekDays = [];
  for(let i=0; i<7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    weekDays.push(d.getTime());
  }

  const stats = weekDays.map(() => ({ tech: 0, soft: 0 }));
  
  tasks.forEach(t => {
    if (t.status !== 'completed' || !t.completedAt) return;
    const tDate = new Date(t.completedAt);
    tDate.setHours(0,0,0,0);
    const idx = weekDays.indexOf(tDate.getTime());
    if (idx !== -1) {
      if (t.type === 'tech') stats[idx].tech += t.elapsedTime;
      else stats[idx].soft += t.elapsedTime;
    }
  });

  if (theme === 'serious') {
    const hist = document.createElement('div');
    hist.className = 'histogram';
    const maxVal = Math.max(...stats.map(s => s.tech + s.soft), 10);
    
    stats.forEach((day, i) => {
      const techH = (day.tech / maxVal) * 100;
      const softH = (day.soft / maxVal) * 100;
      const group = document.createElement('div');
      group.className = 'bar-group';
      const barCont = document.createElement('div');
      barCont.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column-reverse;';
      
      const segTech = document.createElement('div');
      segTech.className = 'bar-segment bar-tech';
      segTech.style.height = `${techH}%`;
      
      const segSoft = document.createElement('div');
      segSoft.className = 'bar-segment bar-soft';
      segSoft.style.height = `${softH}%`;
      
      barCont.appendChild(segTech);
      barCont.appendChild(segSoft);
      
      const label = document.createElement('div');
      label.className = 'day-label';
      label.innerText = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i];
      
      group.appendChild(barCont);
      group.appendChild(label);
      hist.appendChild(group);
    });
    container.appendChild(hist);
  } else {
    const constBox = document.createElement('div');
    constBox.className = 'constellation';
    let points = [];
    
    stats.forEach((day, dayIdx) => {
      const techStars = Math.floor(day.tech / 60);
      const softStars = Math.floor(day.soft / 60);
      for(let i=0; i<techStars; i++) points.push({ type: 'tech', day: dayIdx, offset: i });
      for(let i=0; i<softStars; i++) points.push({ type: 'soft', day: dayIdx, offset: i });
    });
    
    if (points.length > 1) {
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.style.position = "absolute";
      svg.style.top = "0";
      svg.style.left = "0";
      
      const polyline = document.createElementNS(svgNS, "polyline");
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", "rgba(255,255,255,0.3)");
      polyline.setAttribute("stroke-width", "2");
      polyline.setAttribute("points", points.map((p, i) => {
        p.x = (p.day / 6) * 90 + 5;
        p.y = 50 + (Math.sin(i * 0.5) * 40);
        return `${p.x}%,${p.y}%`;
      }).join(" "));
      svg.appendChild(polyline);
      constBox.appendChild(svg);
    }
    
    points.forEach(p => {
      const dot = document.createElement('div');
      dot.className = 'star-point';
      dot.style.left = p.x + '%';
      dot.style.top = p.y + '%';
      dot.style.background = p.type === 'tech' ? '#2196F3' : '#4CAF50';
      constBox.appendChild(dot);
    });
    container.appendChild(constBox);
  }
}

init();
</script>
</body>
</html>
